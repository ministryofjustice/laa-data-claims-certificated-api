# Local development stack. The postgres container's name / credentials are the
# inline defaults below; the app reuses the matching defaults baked into its
# application.yml, so nothing is duplicated. Override any value for a single run
# by exporting it first, e.g. `DB_PASSWORD=secret docker compose up`.
services:
  postgres:
    image: postgres:18
    container_name: data-claims-certificated-api-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-data-claims-certificated-api_dev}
      POSTGRES_USER: ${DB_USERNAME:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-user} -d ${DB_NAME:-data-claims-certificated-api_dev}"]
      interval: 5s
      retries: 10


  app:
    build:
      context: .
    ports:
      - "8081:8081"
      - "8181:8181"
      - "5005:5005"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The app's application.yml already defaults DB_PORT/NAME/USERNAME/PASSWORD to
      # the same values the postgres service uses, so only DB_HOST needs overriding
      # here: inside the compose network the database is reached at the service name
      # (`postgres`), not the app's `localhost` default. Overridable via the shell.
      - DB_HOST=${DB_HOST:-postgres}
      - SERVER_PORT=8081
      - SPRING_PROFILES_ACTIVE=local
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005

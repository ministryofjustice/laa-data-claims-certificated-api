name: "Deploy branch"
description: 'Create a per-PR preview database and deploy the image to UAT with a unique ingress hostname'

inputs:
  ecr-repository:
    description: "ECR repository"
    required: true
  ecr-region:
    description: "ECR region"
    required: true
  ecr-role-to-assume:
    description: "ECR role to assume"
    required: true
  kube-cert:
    description: "Kubernetes cluster authentication certificate"
    required: true
  kube-token:
    description: "Kubernetes cluster authentication token"
    required: true
  kube-cluster:
    description: "Kubernetes cluster name"
    required: true
  kube-namespace:
    description: "Kubernetes cluster namespace"
    required: true
  app-environment:
    description: "Target environment (uat)"
    required: true
  pr-number:
    description: "Pull request number"
    required: false
  image-tag:
    description: "Docker image tag to deploy"
    required: true

outputs:
  release-name:
    description: "Helm release name used for this deployment"
    value: ${{ steps.extract_release_name.outputs.release-name }}

runs:
  using: "composite"
  steps:
    - name: Extract release name
      id: extract_release_name
      uses: ./.github/actions/get_release_name
      with:
        pr-number: ${{ inputs.pr-number }}

    - name: Authenticate to the cluster
      uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@2aa2676c3cd9876ec7037ee8b3d729d0306cb7c6 # unversioned
      with:
        kube-cert: ${{ inputs.kube-cert }}
        kube-token: ${{ inputs.kube-token }}
        kube-cluster: ${{ inputs.kube-cluster }}
        kube-namespace: ${{ inputs.kube-namespace }}

    - name: Apply port-forward deployment and service
      shell: bash
      env:
        KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
      run: |
        kubectl apply -f .helm/laa-data-claims-certificated-api/templates/port-forward-deployment.yaml \
          --namespace "$KUBE_NAMESPACE"
        kubectl apply -f .helm/laa-data-claims-certificated-api/templates/port-forward-service.yaml \
          --namespace "$KUBE_NAMESPACE"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6
      with:
        role-to-assume: ${{ inputs.ecr-role-to-assume }}
        aws-region: ${{ inputs.ecr-region }}

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@376925c9d111252e87ae59691e5a442dd100ef6a # v2.1.3
      with:
        mask-password: 'true'

    - name: Create preview database
      if: ${{ steps.extract_release_name.outputs.branch-name != 'main' }}
      shell: bash
      env:
        RELEASE_NAME: ${{ steps.extract_release_name.outputs.release-name }}
      run: |
        echo "Creating database: $RELEASE_NAME"
        scripts/uat_create_db.sh "$RELEASE_NAME"

    - name: Add laa-generic-helm-chart repository and update dependencies
      shell: bash
      run: |
        helm repo add laa-generic-helm-chart https://ministryofjustice.github.io/laa-generic-helm-chart
        helm repo update
        helm dependency update .helm/laa-data-claims-certificated-api

    - name: Helm deployment of branch preview
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
        RELEASE_NAME: ${{ steps.extract_release_name.outputs.release-name }}
        BRANCH_NAME: ${{ steps.extract_release_name.outputs.branch-name }}
        VALUES_FILE: .helm/laa-data-claims-certificated-api/values/${{ inputs.app-environment }}.yaml
      run: |
        # Build unique hostname for this PR preview
        EXTERNAL_HOST="${RELEASE_NAME}-${KUBE_NAMESPACE}.cloud-platform.service.justice.gov.uk"

        if [ "$BRANCH_NAME" == "main" ]; then
          DB_NAME="main"
        else
          DB_NAME="$RELEASE_NAME"
        fi

        echo "Deploying release '$RELEASE_NAME' to $EXTERNAL_HOST with DB '$DB_NAME'..."

        helm upgrade "$RELEASE_NAME" .helm/laa-data-claims-certificated-api \
          --namespace "$KUBE_NAMESPACE" \
          --values "$VALUES_FILE" \
          --set laa-generic-app.appName="$RELEASE_NAME" \
          --set laa-generic-app.namespace="$KUBE_NAMESPACE" \
          --set laa-generic-app.image.registry="$ECR_REGISTRY" \
          --set laa-generic-app.image.repository="$ECR_REPOSITORY" \
          --set laa-generic-app.image.tag="$IMAGE_TAG" \
          --set laa-generic-app.ingress.green.hostname="$EXTERNAL_HOST" \
          --set laa-generic-app.containerEnvironment.envs[0].name="DB_NAME" \
          --set laa-generic-app.containerEnvironment.envs[0].value="$DB_NAME" \
          --install \
          --wait --timeout=10m


name: Deploy UAT preview

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  JAVA_VERSION: &JAVA_VERSION '25'
  JDK_DISTRIBUTION: &JDK_DISTRIBUTION 'corretto'

jobs:
  build:
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@dc4173bfc12f714d7e8cbdd9f524d00ef02e25c4 # v2
    permissions:
      contents: write
      packages: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
      integration_test_task: "integrationTest"
      publish_package: 'false'
      semgrep_check: 'true'
      junit_results_path: 'laa-data-claims-certificated-service/build/test-results'
      junit_report_path: 'laa-data-claims-certificated-service/build/reports/tests'
      checkstyle_report_path: 'laa-data-claims-certificated-service/build/reports/checkstyle'
      jacoco_coverage_report_path: 'laa-data-claims-certificated-service/build/reports/jacoco'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      aws_region: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_AWS_REGION }}

  sca-scan:
    needs: [ build ]
    uses: ./.github/workflows/sca-analysis.yml
    permissions:
      contents: read
      security-events: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
    secrets:
      snyk_client_id: ${{ secrets.SNYK_CLIENT_ID }}
      snyk_client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

  ecr-publish-image:
    needs: [ build ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@dc4173bfc12f714d7e8cbdd9f524d00ef02e25c4 # v2
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
      jar_subproject: 'laa-data-claims-certificated-service'
      image_version: ${{ github.sha }}
      # Docker image scan is handled by sca-analysis.yml using short-lived SNYK_CLIENT_ID/SECRET
      # tokens — disabling here to avoid duplicate scans and the need for a static SNYK_TOKEN.
      image_scan: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_ROLE_TO_ASSUME }}
      snyk_token: ""

  get-ecr-registry:
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.0.1
        with:
          aws-region: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REGION }}
          role-to-assume: ${{ secrets.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_ROLE_TO_ASSUME }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

  deploy-uat-preview:
    runs-on: ubuntu-latest
    needs:
      - ecr-publish-image
      - sca-scan
      - get-ecr-registry
    environment: uat
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get release name
        id: get_release_name
        uses: ./.github/actions/get_release_name
        with:
          pr-number: ${{ github.event.pull_request.number }}

      - name: Obtain Octo STS Token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo_sts
        with:
          scope: ministryofjustice/laa-generic-helm-chart
          identity: laa-reusable-actions-deploy

      - name: Clone Helm Chart
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ministryofjustice/laa-generic-helm-chart
          token: ${{ steps.octo_sts.outputs.token }}
          path: laa-generic-helm-chart

      - name: Authenticate to the cluster
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@2aa2676c3cd9876ec7037ee8b3d729d0306cb7c6 # unversioned
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Apply port-forward deployment and service
        shell: bash
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        run: |
          kubectl apply -f .helm/laa-data-claims-certificated-api/templates/port-forward-deployment.yaml \
            --namespace "$KUBE_NAMESPACE"
          kubectl apply -f .helm/laa-data-claims-certificated-api/templates/port-forward-service.yaml \
            --namespace "$KUBE_NAMESPACE"

      - name: Create preview database
        if: ${{ github.event.pull_request.number != '' }}
        shell: bash
        env:
          RELEASE_NAME: ${{ steps.get_release_name.outputs.release-name }}
        run: |
          echo "Creating database: $RELEASE_NAME"
          scripts/uat_create_db.sh "$RELEASE_NAME"

      - name: Generate override values file
        shell: bash
        env:
          RELEASE_NAME: ${{ steps.get_release_name.outputs.release-name }}
        run: |
          cat > /tmp/pr-override-values.yaml <<EOF
          ingress:
            green:
              annotations:
                external-dns.alpha.kubernetes.io/set-identifier: "${RELEASE_NAME}-green-laa-data-claims-certificated-api-uat-green"
          EOF

      - name: Helm Deploy
        uses: ministryofjustice/laa-reusable-github-actions/.github/actions/helm-deploy@main
        with:
          k8s_namespace: ${{ secrets.KUBE_NAMESPACE }}
          helm_release_name: ${{ steps.get_release_name.outputs.release-name }}
          helm_chart: ./laa-generic-helm-chart
          helm_values_path: .helm/laa-data-claims-certificated-api/values/uat.yaml
          helm_additional_args: -f /tmp/pr-override-values.yaml --set nameOverride=${{ steps.get_release_name.outputs.release-name }}
          image_registry: ${{ needs.get-ecr-registry.outputs.registry }}
          image_repo: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
          image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}

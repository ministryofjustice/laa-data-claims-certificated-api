name: Helm deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: GitHub environment name (uat, staging, production)
      image_tag:
        required: true
        type: string
        description: Docker image tag to deploy
      image_registry:
        required: true
        type: string
        description: ECR registry URL
      image_repo:
        required: true
        type: string
        description: ECR repository path
      helm_release_name:
        required: false
        type: string
        description: Helm release name (defaults to data-claims-certificated-api-<environment>)
      k8s_service_account:
        required: false
        type: string
        description: Kubernetes service account name for cluster authentication

jobs:
  deploy:
    uses: ministryofjustice/laa-reusable-github-actions/.github/workflows/cp-deploy.yml@main
    with:
      environment: ${{ inputs.environment }}
      image_registry: ${{ inputs.image_registry }}
      image_repo: ${{ inputs.image_repo }}
      image_tag: ${{ inputs.image_tag }}
      helm_release_name: ${{ inputs.helm_release_name || format('data-claims-certificated-api-{0}', inputs.environment) }}
      helm_chart: ./laa-generic-helm-chart
      helm_values_path: .helm/laa-data-claims-certificated-api/values/${{ inputs.environment }}.yaml
      k8s_service_account: ${{ inputs.k8s_service_account }}
    secrets: inherit

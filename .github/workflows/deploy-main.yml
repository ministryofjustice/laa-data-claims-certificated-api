name: Deploy main

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

env:
  JAVA_VERSION: &JAVA_VERSION '25'
  JDK_DISTRIBUTION: &JDK_DISTRIBUTION 'corretto'

jobs:
  assemble:
    # Same shared workflow as build-main.yml, but here it only packages the
    # artifact to ship — validation (tests/quality gates) already ran in
    # build-main.yml before the tag was created. We override build_command to
    # 'assemble' (no tests) and therefore turn off the report inputs (which
    # default to true upstream) since an assemble-only run produces no test,
    # coverage or checkstyle output to publish.
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@dc4173bfc12f714d7e8cbdd9f524d00ef02e25c4 # v2
    permissions:
      contents: write
      packages: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
      build_command: 'assemble'
      publish_package: 'false'
      junit_results: 'false'
      junit_report: 'false'
      checkstyle_report: 'false'
      jacoco_coverage_report: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  sca-scan:
    needs:
      - assemble
    uses: ./.github/workflows/sca-analysis.yml
    permissions:
      contents: read
      security-events: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
    secrets:
      snyk_client_id: ${{ secrets.SNYK_CLIENT_ID }}
      snyk_client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

  ecr-publish-image:
    needs: [ assemble ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@dc4173bfc12f714d7e8cbdd9f524d00ef02e25c4 # v2
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
      jar_subproject: 'laa-data-claims-certificated-service'
      image_version: ${{ format('data-claims-certificated-api-{0}', needs.assemble.outputs.published_artifact_version) }}
      # Docker image scan is handled by sca-analysis.yml using short-lived SNYK_CLIENT_ID/SECRET
      # tokens — disabling here to avoid duplicate scans and the need for a static SNYK_TOKEN.
      image_scan: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_ROLE_TO_ASSUME }}
      snyk_token: ""

  # Reusable-workflow "uses:" jobs cannot reference secrets.* in their `with:`
  # inputs, so expose the Terraform-managed ECR_REGISTRY_URL secret as a job output
  # that the deploy jobs can pass through (outputs are allowed in `with:`).
  resolve-registry:
    needs: [ assemble ]
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.reg.outputs.registry }}
    steps:
      - name: Expose ECR registry host
        id: reg
        env:
          ECR_REGISTRY_URL: ${{ secrets.ECR_REGISTRY_URL }}
        run: echo "registry=${ECR_REGISTRY_URL}" >> "$GITHUB_OUTPUT"

  deploy-uat:
    needs:
      - ecr-publish-image
      - sca-scan
      - resolve-registry
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: uat
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
      image_registry: ${{ needs.resolve-registry.outputs.registry }}
      image_repo: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
      k8s_service_account: laa-data-claims-certificated-api-uat-service-account
    secrets: inherit

  deploy-staging:
    needs:
      - ecr-publish-image
      - sca-scan
      - resolve-registry
      - deploy-uat
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: staging
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
      image_registry: ${{ needs.resolve-registry.outputs.registry }}
      image_repo: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
      k8s_service_account: laa-data-claims-certificated-api-staging-service-account
    secrets: inherit

  deploy-production:
    needs:
      - ecr-publish-image
      - sca-scan
      - resolve-registry
      - deploy-staging
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
      image_registry: ${{ needs.resolve-registry.outputs.registry }}
      image_repo: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
      k8s_service_account: laa-data-claims-certificated-api-prod-service-account
    secrets: inherit

name: Deploy main

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: &JAVA_VERSION '25'
  JDK_DISTRIBUTION: &JDK_DISTRIBUTION 'corretto'

jobs:
  assemble:
    # Same shared workflow as build-main.yml, but here it only packages the
    # artifact to ship — validation (tests/quality gates) already ran in
    # build-main.yml before the tag was created. We override build_command to
    # 'assemble' (no tests) and therefore turn off the report inputs (which
    # default to true upstream) since an assemble-only run produces no test,
    # coverage or checkstyle output to publish.
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/gradle-build-and-publish.yml@3eaf64bb987ef0648a2380d4e49927d1693ec195 # v2.2.1
    permissions:
      contents: write
      packages: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
      build_command: 'assemble'
      publish_package: 'true'
      junit_results: 'false'
      junit_report: 'false'
      checkstyle_report: 'false'
      jacoco_coverage_report: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      # aws_region: ${{ vars.AWS_REGION }} # although not required, it would be good to explicitly set this

  sca-scan:
    needs:
      - assemble
    uses: ./.github/workflows/sca-analysis.yml
    permissions:
      contents: read
      security-events: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
    secrets:
      snyk_client_id: ${{ secrets.SNYK_CLIENT_ID }}
      snyk_client_secret: ${{ secrets.SNYK_CLIENT_SECRET }}

  ecr-publish-image:
    needs: [ assemble ]
    uses: ministryofjustice/laa-ccms-common-workflows/.github/workflows/ecr-publish-image.yml@3eaf64bb987ef0648a2380d4e49927d1693ec195 # v2.2.1
    permissions:
      contents: read
      id-token: write
      security-events: write
    with:
      java_version: *JAVA_VERSION
      java_distribution: *JDK_DISTRIBUTION
      jar_subproject: 'laa-data-claims-certificated-service'
      image_version: ${{ format('data-claims-certificated-api-{0}', needs.assemble.outputs.published_artifact_version) }}
      # Docker image scan is handled by sca-analysis.yml using short-lived SNYK_CLIENT_ID/SECRET
      # tokens — disabling here to avoid duplicate scans and the need for a static SNYK_TOKEN.
      image_scan: 'false'
    secrets:
      gh_token: ${{ secrets.GITHUB_TOKEN }}
      ecr_repository: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
      ecr_region: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REGION }}
      ecr_role_to_assume: ${{ secrets.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_ROLE_TO_ASSUME }}
      snyk_token: "" # SNYK_TOKEN, set if available, otherwise set by auth step

  # Obtain the ECR registry host for the Helm deploy. The shared ecr-publish-image
  # workflow logs into ECR but does not output the registry, and a reusable-workflow
  # "uses:" job can't read secrets.* in its `with:` (nor can a secret be piped through
  # a job output — masking blanks it). So we log in here and expose the non-secret
  # registry value as a job output.
  get-ecr-registry:
    needs: [ assemble ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v4.0.1
        with:
          aws-region: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REGION }}
          role-to-assume: ${{ secrets.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_ROLE_TO_ASSUME }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

  get-laa-ips:
    runs-on: ubuntu-latest
    outputs:
      laa_ips: ${{ steps.fetch.outputs.laa_ips }}
    steps:
      - name: Fetch LAA IP allowlist
        id: fetch
        run: |
          LAA_IPS=$(curl -s https://raw.githubusercontent.com/ministryofjustice/laa-ip-allowlist/main/cidrs.txt | tr -d ' ' | tr '\n' ',' | sed 's/,/\\,/g' | sed 's/\\,$//')
          echo "laa_ips=$LAA_IPS" >> $GITHUB_OUTPUT

  deploy-uat:
    needs:
      - ecr-publish-image
      - sca-scan
      - get-ecr-registry
      - get-laa-ips
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: uat
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
      image_registry: ${{ needs.get-ecr-registry.outputs.registry }}
      image_repo: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
      k8s_service_account: laa-data-claims-certificated-api-uat-service-account
      helm_additional_args: >-
        --set 'ingress.blue.annotations.nginx\.ingress\.kubernetes\.io/whitelist-source-range=${{ needs.get-laa-ips.outputs.laa_ips }}'
    secrets: inherit

  deploy-staging:
    needs:
      - ecr-publish-image # Redundant? As deploy-uat already does this
      - sca-scan # Redundant? As deploy-uat already does this
      - get-ecr-registry # Redundant? As deploy-uat already does this
      - get-laa-ips # Redundant? As deploy-uat already does this
      - deploy-uat
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: staging
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
      image_registry: ${{ needs.get-ecr-registry.outputs.registry }}
      image_repo: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
      k8s_service_account: laa-data-claims-certificated-api-staging-service-account
      helm_additional_args: >-
        --set 'ingress.blue.annotations.nginx\.ingress\.kubernetes\.io/whitelist-source-range=${{ needs.get-laa-ips.outputs.laa_ips }}'
    secrets: inherit

  deploy-production:
    needs:
      - ecr-publish-image # Redundant? As deploy-staging already does this
      - sca-scan # Redundant? As deploy-staging already does this
      - get-ecr-registry # Redundant? As deploy-staging already does this
      - deploy-staging
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/helm-deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.ecr-publish-image.outputs.published_image_version }}
      image_registry: ${{ needs.get-ecr-registry.outputs.registry }}
      image_repo: ${{ vars.LAA_DATA_CLAIMS_CERTIFICATED_API_ECR_REPOSITORY }}
      k8s_service_account: laa-data-claims-certificated-api-prod-service-account
    secrets: inherit

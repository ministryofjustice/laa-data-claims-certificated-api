info:
  name: Get item by id
  type: http
  seq: 1
  tags:
    - items

http:
  method: GET
  url: "{{baseUrl}}/api/v1/items/:id"
  params:
    - name: id
      value: ""
      type: path
      description: The id of the item to retrieve
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


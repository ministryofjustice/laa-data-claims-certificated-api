info:
  name: Create an item
  type: http
  seq: 2
  tags:
    - items

http:
  method: POST
  url: "{{baseUrl}}/api/v1/items"
  body:
    type: json
    data: |-
      {
        "name": "Ben",
        "description": "Test"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:

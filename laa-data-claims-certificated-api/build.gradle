plugins {
    id 'org.openapi.generator' version '7.23.0'
    id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin'
}

repositories {
    mavenCentral()
}

// Upgrade logback to fix Expression Injection (SNYK-JAVA-CHQOSLOGBACK-17675439)
// Overrides the Spring Boot managed logback.version for logback-core and logback-classic.
ext['logback.version'] = '1.5.36'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.10'
}

sourceSets.main.java.srcDirs += ['generated/src/main/java']

checkstyleMain.exclude "*"

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/laa-data-claims-certificated-api/open-api-specification.yml".toString()
    outputDir = "$rootDir/laa-data-claims-certificated-api/generated".toString()
    apiPackage = "uk.gov.justice.laa.data.claims.certificated.api.api"
    invokerPackage = "uk.gov.justice.laa.data.claims.certificated.api.invoker"
    modelPackage = "uk.gov.justice.laa.data.claims.certificated.api.model"
    configOptions = [
            generateBuilders    : "true",
            interfaceOnly       : "true", // This will only generate interfaces, not implementations
            serializableModel   : "true",
            skipDefaultInterface: "true",
            useJakartaEe        : "true",
            useSpringBoot3      : "true",
            useTags             : "true",
    ]
}

compileJava.dependsOn 'openApiGenerate'

clean {
    delete "$rootDir/laa-data-claims-certificated-api/generated"
}

// disable for overall project when running a build
tasks.named('bootJar') {
    enabled = false
}

tasks.named('bootRun') {
    enabled = false
}
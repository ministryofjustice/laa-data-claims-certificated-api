openapi: "3.0.0"
info:
  version: 1.0.0
  title: Items API
paths:
  /api/v1/items:
    get:
      tags:
        - items
      summary: Get items
      operationId: getItems
      responses:
        '200':
          description: 'Success'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Items"
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '403':
          description: 'Forbidden'
        '404':
          description: 'Not found'
        '429':
          description: 'Too many requests'
        '500':
          description: 'Internal server error'
    post:
      tags:
        - items
      summary: Create an item
      operationId: createItem
      requestBody:
        description: create an item
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequestBody'
      responses:
        '201':
          description: 'Created'
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '403':
          description: 'Forbidden'
        '404':
          description: 'Not found'
        '429':
          description: 'Too many requests'
        '500':
          description: 'Internal server error'

  /api/v1/items/{id}:
    get:
      summary: Get item by id
      operationId: getItemById
      tags:
        - items
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the item to retrieve
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '403':
          description: 'Forbidden'
        '404':
          description: 'Not found'
        '429':
          description: 'Too many requests'
        '500':
          description: 'Internal server error'
    put:
      tags:
        - items
      summary: Update an item
      operationId: updateItem
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the item to be updated
          schema:
            type: integer
            format: int64
      requestBody:
        description: update an existing item
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequestBody'
      responses:
        '204':
          description: No content
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '403':
          description: 'Forbidden'
        '404':
          description: 'Not found'
        '429':
          description: 'Too many requests'
        '500':
          description: 'Internal server error'
    delete:
      summary: Delete item by id
      operationId: deleteItem
      tags:
        - items
      parameters:
        - name: id
          in: path
          required: true
          description: The id of the item to be deleted
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No content
        '400':
          description: 'Bad request'
        '401':
          description: 'Unauthorized'
        '403':
          description: 'Forbidden'
        '404':
          description: 'Not found'
        '429':
          description: 'Too many requests'
        '500':
          description: 'Internal server error'

  /api/v1/drafts:
    post:
      tags:
        - drafts
      summary: Create a draft claim
      operationId: createDraft
      requestBody:
        description: create a draft claim
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftClaimCreateRequest'
      responses:
        '201':
          description: 'Created'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftClaim"
        '400':
          description: 'Bad request'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        '401':
          description: 'Unauthorized'
        '403':
          description: 'Forbidden'
        '404':
          description: 'Not found'
        '429':
          description: 'Too many requests'
        '500':
          description: 'Internal server error'

components:
  schemas:
    Item:
      required:
        - id
        - name
        - description
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    ItemRequestBody:
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string
    Items:
      type: array
      items:
        $ref: "#/components/schemas/Item"
    DraftClaim:
      required:
        - id
        - sourceSystem
        - createdByUserId
      properties:
        id:
          type: string
          format: uuid
        sourceSystem:
          type: string
        createdByUserId:
          type: string
        data:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        draftTypeId:
          type: string
          format: uuid
        certificateId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - draft
            - deleted
    DraftClaimCreateRequest:
      required:
        - sourceSystem
        - createdByUserId
      properties:
        sourceSystem:
          type: string
        createdByUserId:
          type: string
        data:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        draftTypeId:
          type: string
          format: uuid
        certificateId:
          type: string
    ProblemDetail:
      required:
        - type
        - title
        - status
        - detail
        - instance
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

apiVersion: v1
kind: Pod
metadata:
  name: port-forward-pod
  namespace: laa-data-claims-certificated-api-uat
  labels:
    run: port-forward-pod
  annotations:
    github_teams: laa-data-stewardship-payments-team
spec:
  serviceAccountName: default
  securityContext:
    supplementalGroups:
      - 1
    fsGroup: 1
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: port-forward-pod
      # Pinned by digest for supply-chain integrity (was implicit :latest).
      image: ministryofjustice/port-forward@sha256:207e37914f12989ebbf7f8e9d6e7fff3671ae9ac49a4af618dea14a82a6ddfe0
      imagePullPolicy: Always
      ports:
        - containerPort: 5432
          protocol: TCP
      env:
        - name: REMOTE_HOST
          valueFrom:
            secretKeyRef:
              name: rds-postgresql-instance-output
              key: rds_instance_address
        - name: LOCAL_PORT
          value: "5432"
        - name: REMOTE_PORT
          value: "5432"
      resources:
        limits:
          cpu: "1"
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 128Mi
      securityContext:
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        allowPrivilegeEscalation: false
  restartPolicy: Never
  dnsPolicy: ClusterFirst
  terminationGracePeriodSeconds: 30


# Production values for data-claims-certificated-api
# Used directly with laa-generic-helm-chart (cloned via cp-deploy.yml).
appName: ""
nameOverride: data-claims-certificated-api
namespace: laa-data-claims-certificated-api-prod
environmentName: production
replicaCount: 2
minReplicaCount: 2
image:                # set by CI pipeline
  registry: ""
  repository: ""
  tag: ""
service:
  port: 8081
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8181
  initialDelaySeconds: 60
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8181
  initialDelaySeconds: 30
resources:
  limits:
    cpu: 1000m
    memory: 1G
  requests:
    cpu: 25m
    memory: 1G
autoscaling:
  enabled: true
  maxReplicaCount: 8
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
serviceAccountName: laa-data-claims-certificated-api-prod-service-account
# DB connection details injected from the Kubernetes Secret that Cloud Platform
# creates automatically when the RDS Terraform module is applied to the namespace.
# Secret name: rds-postgresql-instance-output
containerEnvironment:
  enabled: true
  secrets:
    - name: DB_HOST
      secretName: rds-postgresql-instance-output
      key: rds_instance_address
    - name: DB_NAME
      secretName: rds-postgresql-instance-output
      key: database_name
    - name: DB_USERNAME
      secretName: rds-postgresql-instance-output
      key: database_username
    - name: DB_PASSWORD
      secretName: rds-postgresql-instance-output
      key: database_password
ingress:
  # Production is internal-only (green = internal ingress, no public/blue ingress)
  green:
    enabled: true
    className: internal
    hostname: "data-claims-certificated-api-production.internal.cloud-platform.service.justice.gov.uk"
    annotations:
      external-dns.alpha.kubernetes.io/aws-weight: "100"
      external-dns.alpha.kubernetes.io/set-identifier: "data-claims-certificated-api-green-laa-data-claims-certificated-api-prod-green"
servicemonitor:
  enabled: false

metrics:
  mainReleaseName: production

grafana:
  enabled: true

sentry:
  enabled: true
  environment: production
  tracesSampleRate: 0.25

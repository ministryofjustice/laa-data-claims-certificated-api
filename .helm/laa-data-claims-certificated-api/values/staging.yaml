# Staging values for data-claims-certificated-api
# Used directly with laa-generic-helm-chart (cloned via cp-deploy.yml).
appName: data-claims-certificated-api
namespace: laa-data-claims-certificated-api-staging
environmentName: staging
replicaCount: 2
minReplicaCount: 2
image:                # set by CI pipeline
  registry: ""
  repository: ""
  tag: ""
service:
  port: 8081
livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8181
  initialDelaySeconds: 60
readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8181
  initialDelaySeconds: 30
resources:
  limits:
    cpu: 1000m
    memory: 1G
  requests:
    cpu: 25m
    memory: 1G
autoscaling:
  enabled: true
  maxReplicaCount: 8
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70
# DB connection details injected from the Kubernetes Secret that Cloud Platform
# creates automatically when the RDS Terraform module is applied to the namespace.
# Secret name: rds-postgresql-instance-output
containerEnvironment:
  enabled: true
  secrets:
    - name: DB_HOST
      secretName: rds-postgresql-instance-output
      key: rds_instance_address
    - name: DB_NAME
      secretName: rds-postgresql-instance-output
      key: database_name
    - name: DB_USERNAME
      secretName: rds-postgresql-instance-output
      key: database_username
    - name: DB_PASSWORD
      secretName: rds-postgresql-instance-output
      key: database_password
ingress:
  green:
    enabled: true
    className: modsec-non-prod
    hostname: "data-claims-certificated-api-staging.cloud-platform.service.justice.gov.uk"
servicemonitor:
  enabled: false

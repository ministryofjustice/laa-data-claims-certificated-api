server:
  port: 8081 # change to desired port number

spring:
  application:
    name: laa-data-claims-certificated-api
    version: @version@

  # PostgreSQL datasource — connection details injected from environment (RDS in deployed envs,
  # local postgres container in docker-compose). All four vars have localhost defaults so the
  # service also starts when running directly via IntelliJ / bootRun without Docker.
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:data-claims-certificated-api_dev}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:dev}
    hikari:
      minimum-idle: ${HIKARI_MIN_POOL_SIZE:2}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}          # 10 min (ms)
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000} # 30s (ms)
  flyway:
    enabled: true
    schemas: public
    # Keep migrations strictly ordered in deployed environments to avoid schema
    # divergence (important given downstream replication). Can be overridden per
    # environment if ever needed.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:false}

  #do not auto create db schema, use Flyway migrations
  jpa:
    hibernate:
      ddl-auto: none

# API docs / Swagger UI are disabled by default (secure-by-default). They are
# turned on per environment via SPRINGDOC_*_ENABLED: enabled in UAT (see
# values/uat.yaml) for the PR previews + main UAT, and left off in staging and
# production. The `local` profile (application-local.yml) also re-enables them
# for local dev; that profile is only ever activated by docker-compose
# (SPRING_PROFILES_ACTIVE=local), never by the Helm deployments.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}

management:
  server:
    port: 8181 # change to desired port number
  # specify actuator endpoints to enable
  endpoints:
    web:
      exposure:
        include: health,prometheus

sentry:
  dsn: # configure dsn url here
  environment: # configure environment name here

# ECS structured logging
logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    uk.gov.justice.laa.data.claims.certificated.api: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:default}
        version: ${spring.application.version:default}
        environment: ${spring.profiles.active:default}
        node_name: ${HOSTNAME:unknown}

# Configure resilience4j rate limiters, one instance per API operation.
# - limitForPeriod:      max number of requests permitted within each refresh window
# - limitRefreshPeriod:  length of the window after which the permit count is reset
# - timeoutDuration:     how long a caller waits for a permit before being rejected.
#                        0s means excess requests are rejected immediately with HTTP 429
#                        (instead of blocking), which is what triggers the genericFallback.
resilience4j.ratelimiter:
  instances:
    getItemsRateLimiter:
      limitForPeriod: 10
      limitRefreshPeriod: 1s
      timeoutDuration: 0s
    getItemRateLimiter:
      limitForPeriod: 10
      limitRefreshPeriod: 1s
      timeoutDuration: 0s
    createItemRateLimiter:
      limitForPeriod: 10
      limitRefreshPeriod: 1s
      timeoutDuration: 0s
    updateItemRateLimiter:
      limitForPeriod: 10
      limitRefreshPeriod: 1s
      timeoutDuration: 0s
    deleteItemRateLimiter:
      limitForPeriod: 10
      limitRefreshPeriod: 1s
      timeoutDuration: 0s

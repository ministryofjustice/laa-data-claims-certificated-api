# Local development profile (activated by SPRING_PROFILES_ACTIVE=local, e.g. via
# docker-compose). Spring loads this on top of application.yml whenever the
# `local` profile is active; it is never used by the Helm deployments.

# Re-enable API docs / Swagger UI for local development (off by default in
# application.yml for secure-by-default in deployed environments).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    uk.gov.justice.laa.data.claims.certificated.api: ${APP_LOGGING_LEVEL:info}
  structured:
    format:
      console: # disables structured logging locally
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr{faint} %clr([%15.15t]){faint} %clr([%X{traceId:-},%X{spanId:-}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"


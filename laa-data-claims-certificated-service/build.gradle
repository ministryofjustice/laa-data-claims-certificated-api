plugins {
    id 'io.freefair.lombok' version '9.5.0'
    id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin'
    id 'io.sentry.jvm.gradle' version '6.14.0'
    id 'com.diffplug.spotless' version '8.8.0'
}

// Replaces application.yml @version@  with version from gradle.properties
processResources {
    filesMatching('application.yml') {
        filter {
            it.replace('@version@', version)
        }
    }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/DataClaimsCertificatedApiApplication.class'])
        }))
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['**/DataClaimsCertificatedApiApplication.class'])
        }))
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        importOrder()
        removeUnusedImports()
        cleanthat()
        googleJavaFormat('1.27.0')
    }
}

// Dependency overrides
// example:
// Upgrade to fix CVE-xxxx-xxxxx
// ext['dependency-name.version'] = 'x.x.x'

// **** When adding new overrides please check if any existing overrides are now redundant (by removing them and adding them back only if required)

// Upgrade logback to fix Expression Injection (SNYK-JAVA-CHQOSLOGBACK-17675439)
// Overrides the Spring Boot managed logback.version for logback-core and logback-classic.
ext['logback.version'] = '1.5.36'

// Upgrade Tomcat to fix Improper Authentication (SNYK-JAVA-ORGAPACHETOMCATEMBED-17732890)
// and Detection of Error Condition Without Action (SNYK-JAVA-ORGAPACHETOMCATEMBED-17733746)
ext['tomcat.version'] = '11.0.23'

// Upgrade PostgreSQL JDBC driver to fix Incorrect Implementation of Authentication Algorithm
// (SNYK-JAVA-ORGPOSTGRESQL-17874248)
// Overrides the Spring Boot managed postgresql.version.
ext['postgresql.version'] = '42.7.12'

dependencies {
    implementation project(':laa-data-claims-certificated-api')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Required for tracing information
    implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'

    implementation 'org.apache.commons:commons-lang3:3.20.0'

    // Rate Limiting / resilience
    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // temporary dependency overrides see README
    implementation 'com.fasterxml.jackson.core:jackson-core:2.22.1'
    implementation 'tools.jackson.core:jackson-core:3.2.0'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
    testImplementation 'org.springframework.boot:spring-boot-test-autoconfigure'

    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'au.com.dius.pact.provider:spring7:4.7.3'

    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    sourceSets {
        pactTest {
            java {
                compileClasspath += main.output + test.output
                runtimeClasspath += main.output + test.output
            }
        }
    }

    configurations {
        pactTestImplementation.extendsFrom(testImplementation)
        pactTestRuntimeOnly.extendsFrom(testRuntimeOnly)
    }

    dependencies {
        // Pact Spring 6/7 provider support
        pactTestImplementation 'au.com.dius.pact.provider:spring7:4.7.3'
        pactTestImplementation 'org.apache.httpcomponents:httpclient:4.5.14'
    }

    tasks.register('pactTest', Test) {
        description = 'Runs the pact tests.'
        group = 'verification'
        useJUnitPlatform()

        testClassesDirs = sourceSets.pactTest.output.classesDirs
        classpath = sourceSets.pactTest.runtimeClasspath

        // Publish if both username and password environment variables are provided
        def canPublish =
                providers.environmentVariable('PACT_BROKER_USERNAME').isPresent() &&
                        providers.environmentVariable('PACT_BROKER_PASSWORD').isPresent()

        if (canPublish) {
            systemProperty 'pact.verifier.publishResults', 'true'
        }

        // Pass environment variables into the test process as System Properties
        systemProperty 'pact.provider.version', providers.environmentVariable('GIT_SHA').getOrElse('1.0.0')
        systemProperty 'pactbroker.url', providers.environmentVariable('PACT_BROKER_URL').getOrElse('https://laa-data-pact-broker.apps.live.cloud-platform.service.justice.gov.uk/')
        systemProperty 'pactbroker.auth.username', providers.environmentVariable('PACT_BROKER_USERNAME').getOrElse('ABC')
        systemProperty 'pactbroker.auth.password', providers.environmentVariable('PACT_BROKER_PASSWORD').getOrElse('ABC')

        // Only set the consumer filter and branch selectors if PACT_CONSUMER_NAME is provided
        def consumerName = providers.environmentVariable('PACT_CONSUMER_NAME').orNull

        if (consumerName) {
            systemProperty 'pact.filter.consumers', consumerName
        }
        def branch = providers.environmentVariable('PACT_CONSUMER_BRANCH').getOrElse('main')
        systemProperty 'pactbroker.consumerversionselectors.rawjson', "[{\"branch\":\"${branch}\"}]"

        // Resolve the directory path to a String for the system property
        systemProperty 'pact.rootDir', layout.buildDirectory.dir("pacts").get().asFile.path
    }

    tasks.named('processPactTestResources') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
}
